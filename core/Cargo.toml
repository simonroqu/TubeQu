[package]
name = "tubequ-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "TubeQu ohne Oberfläche: YouTube (rustypipe, yt-dlp), Fortschritt, Listen, SponsorBlock (für die GTK-App und Android)"

[dependencies]
if-addrs = "0.15.0"
qu-core = { git = "https://github.com/simonroqu/quCore", default-features = false }
# TLS: Desktop wie bisher (System), Android mit rustls (OpenSSL lässt sich dort schlecht bauen).
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2"] }
rustypipe = { version = "0.11", default-features = false }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "process", "net", "io-util"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
rustypipe = { version = "0.11", default-features = false, features = ["default-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
# rustypipes JS-Engine hat keine fertigen Bindings für Android: beim Bauen erzeugen (braucht libclang auf dem Rechner).
rquickjs = { version = "0.9", features = ["bindgen"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time", "sync", "rt-multi-thread"] }
