[package]
name = "tubequ"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = ["core", "ffi"]

[dependencies]
# Alles ohne Oberfläche (YouTube, Fortschritt, Listen, SponsorBlock): core/.
tubequ-core = { path = "core" }
# Gemeinsamer Unterbau (Theme, Icons, Animationen, Suche, Upscaling …).
qu-core = { git = "https://github.com/simonroqu/quCore" }  # immer der neueste Stand (install-Skripte: cargo update -p qu-core)
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_20"] }
libloading = "0.9.0"
libmpv2 = "7"
libmpv2-sys = "4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time", "sync", "rt-multi-thread"] }
