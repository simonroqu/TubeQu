[package]
name = "tubequ"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Gemeinsamer Unterbau (Theme, Icons, Animationen, Suche, Upscaling …).
qu-core = { git = "https://github.com/simonroqu/quCore", tag = "v0.1.0" }
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_20"] }
libloading = "0.9.0"
libmpv2 = "7"
libmpv2-sys = "4"
reqwest = "0.12"
rustypipe = "0.11"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time", "sync", "rt-multi-thread"] }
