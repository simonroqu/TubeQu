# Bei jedem Tag (v…) unter Windows bauen und TubeQu-windows.zip an den Release hängen.
# Gebaut wird in MSYS2 (UCRT64), dort gibt es GTK4 und libmpv fertig; die nötigen DLLs und Daten kommen mit ins ZIP.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # zum Ausprobieren von Hand starten (Actions → Windows → Run workflow), ohne Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      # Pakete, Bauen und Zusammenstellen: windows-bundle.sh (dasselbe wie install.ps1); quCore ist öffentlich.
      - run: |
          sh windows-bundle.sh
          ls target/TubeQu/bin
          (cd target && zip -qr ../TubeQu-windows.zip TubeQu)

      # Ordner statt ZIP: GitHub verpackt Artifacts beim Herunterladen selbst als ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: TubeQu-windows
          path: target/TubeQu

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TubeQu-windows.zip
